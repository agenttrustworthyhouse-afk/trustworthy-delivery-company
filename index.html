<script>
const trackingData = {
  "TDC1001": {
    status: "In Transit", 
    origin: "New York, USA", 
    destination: "São Paulo, Brazil",
    current: "Miami International Hub, USA", 
    eta: "Aug 18, 2026", 
    progress: "55%"
  },
  "TDC1002": {
    status: "Processing", 
    origin: "Istanbul, Turkey", 
    destination: "Rio de Janeiro, Brazil",
    current: "Customs Clearance", 
    eta: "Aug 20, 2026", 
    progress: "25%"
  },
  "TDC1003": {
    status: "Out for Delivery", 
    origin: "London, UK", 
    destination: "Brasília, Brazil",
    current: "São Paulo Distribution Center", 
    eta: "Today", 
    progress: "90%"
  }
};

function trackPackage() {
  const num = document.getElementById('trackingInput').value.toUpperCase();
  const resultDiv = document.getElementById('trackingResult');
  const data = trackingData[num];
  
  if(data) {
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#e8f5e9';
    resultDiv.innerHTML = `
      <h3>📦 Status: ${data.status}</h3>
      <p><b>From:</b> ${data.origin}</p>
      <p><b>To:</b> ${data.destination}</p>
      <p><b>Current Location:</b> ${data.current}</p>
      <p><b>Estimated Delivery:</b> ${data.eta}</p>
      <div style="background:#ddd; border-radius:10px; height:10px; margin-top:10px;">
        <div style="background:#0056b3; width:${data.progress}; height:10px; border-radius:10px;"></div>
      </div>
      <p style="font-size:12px; margin-top:5px;">Progress: ${data.progress}</p>
    `;
  } else {
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#ffebee';
    resultDiv.innerHTML = `<p>❌ Tracking number not found. Please check and try again or contact us on WhatsApp 08138344049.</p>`;
  }
}
                                                </script>
