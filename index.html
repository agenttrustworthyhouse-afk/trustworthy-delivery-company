    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustworthy Delivery Company - TDC</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f4f4f4; }
    header { background:#0056b3; color:white; padding:15px; text-align:center; }
 .lang-switch { text-align:right; padding:10px; background:#003d82; }
 .lang-switch button { background:white; border:none; padding:6px 12px; margin:2px; border-radius:4px; cursor:pointer; font-weight:bold; }
 .container { max-width:900px; margin:20px auto; padding:20px; background:white; border-radius:8px; }
    input { padding:10px; width:60%; border:1px solid #ccc; border-radius:5px; }
    button.track { padding:10px 15px; background:#ff6600; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
    #trackingResult { margin-top:20px; padding:15px; border-radius:8px; display:none; }
    #map { width:100%; height:300px; margin-top:15px; border-radius:8px; display:none; border:1px solid #ddd; }
 .contact { background:#f4f4f4; padding:20px; text-align:center; margin-top:30px; border-radius:8px; }
 .whatsapp { display:inline-block; background:#25D366; color:white; padding:12px 25px; border-radius:8px; text-decoration:none; font-weight:bold; margin-top:10px; }
  </style>
</head>
<body>

<header>
  <h1>📦 Trustworthy Delivery Company</h1>
  <p id="slogan">Fast. Safe. Reliable. Global Delivery.</p>
</header>

<div class="lang-switch">
  <button onclick="setLanguage('en')">English</button>
  <button onclick="setLanguage('pt')">Português</button>
  <button onclick="setLanguage('es')">Español</button>
</div>

<div class="container">
  <section id="track">
    <h2 id="trackTitle">Track Your Package</h2>
    <input type="text" id="trackingInput" placeholder="Enter Tracking Number e.g. TDC1001">
    <button class="track" id="trackBtn" onclick="trackPackage()">Track</button>
    <div id="trackingResult"></div>
    <div id="map"></div>
  </section>

  <section class="contact">
    <h3 id="contactTitle">Contact Us</h3>
    <p>📞 <a href="tel:08138344049">0813 834 4049</a></p>
    <p>✉️ <a href="mailto:support@tdc.ng">support@tdc.ng</a></p>
    <a href="https://wa.me/2348138344049" class="whatsapp" id="whatsappBtn">💬 Chat on WhatsApp</a>
  </section>
</div>

<script>
const translations = {
  en: { slogan: "Fast. Safe. Reliable. Global Delivery.", title: "Track Your Package", placeholder: "Enter Tracking Number e.g. TDC1001", button: "Track", contact: "Contact Us", whatsapp: "💬 Chat on WhatsApp", from: "From:", to: "To:", current: "Current Location:", eta: "Estimated Delivery:", progress: "Progress:", notFound: "❌ Tracking number not found. Please check and try again or contact us on WhatsApp 08138344049." },
  pt: { slogan: "Rápido. Seguro. Confiável. Entrega Global.", title: "Rastrear Sua Encomenda", placeholder: "Digite o Código de Rastreio ex: TDC1001", button: "Rastrear", contact: "Fale Conosco", whatsapp: "💬 Falar no WhatsApp", from: "De:", to: "Para:", current: "Localização Atual:", eta: "Entrega Prevista:", progress: "Progresso:", notFound: "❌ Código de rastreio não encontrado. Verifique e tente novamente ou fale conosco no WhatsApp 08138344049." },
  es: { slogan: "Rápido. Seguro. Confiable. Entrega Global.", title: "Rastrear Tu Paquete", placeholder: "Ingrese Número de Seguimiento ej: TDC1001", button: "Rastrear", contact: "Contáctanos", whatsapp: "💬 Chatear por WhatsApp", from: "De:", to: "Para:", current: "Ubicación Actual:", eta: "Entrega Estimada:", progress: "Progreso:", notFound: "❌ Número de seguimiento no encontrado. Verifique e intente de nuevo o contáctenos por WhatsApp 08138344049." }
};

let currentLang = 'en';
let map, marker;

const trackingData = {
  "TDC1001": {
    status: {en: "In Transit", pt: "Em Trânsito", es: "En Tránsito"},
    origin: "New York, USA", destination: "São Paulo, Brazil",
    current: "Miami International Hub, USA",
    lat: 25.7933, lng: -80.2906,
    eta: "Aug 18, 2026", progress: "55%"
  },
  "TDC1002": {
    status: {en: "Processing", pt: "Processando", es: "Procesando"},
    origin: "Istanbul, Turkey", destination: "Rio de Janeiro, Brazil",
    current: "Istanbul Airport, Turkey",
    lat: 41.2753, lng: 28.7519,
    eta: "Aug 20, 2026", progress: "25%"
  },
  "TDC1003": {
    status: {en: "Out for Delivery", pt: "Saiu para Entrega", es: "En Camino para Entrega"},
    origin: "London, UK", destination: "Buenos Aires, Argentina",
    current: "São Paulo Distribution Center",
    lat: -23.5505, lng: -46.6333,
    eta: "Today", progress: "90%"
  }
};

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), { zoom: 3, center: { lat: 20, lng: 0 } });
}

function setLanguage(lang) {
  currentLang = lang;
  const t = translations[lang];
  document.getElementById('slogan').innerText = t.slogan;
  document.getElementById('trackTitle').innerText = t.title;
  document.getElementById('trackingInput').placeholder = t.placeholder;
  document.getElementById('trackBtn').innerText = t.button;
  document.getElementById('contactTitle').innerText = t.contact;
  document.getElementById('whatsappBtn').innerText = t.whatsapp;
}

function trackPackage() {
  const t = translations[currentLang];
  const num = document.getElementById('trackingInput').value.toUpperCase();
  const resultDiv = document.getElementById('trackingResult');
  const mapDiv = document.getElementById('map');
  const data = trackingData[num];

  if(data) {
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#e8f5e9';
    resultDiv.innerHTML = `
      <h3>📦 ${data.status[currentLang]}</h3>
      <p><b>${t.from}</b> ${data.origin}</p>
      <p><b>${t.to}</b> ${data.destination}</p>
      <p><b>${t.current}</b> ${data.current}</p>
      <p><b>${t.eta}</b> ${data.eta}</p>
      <div style="background:#ddd; border-radius:10px; height:10px; margin-top:10px;">
        <div style="background:#0056b3; width:${data.progress}; height:10px; border-radius:10px;"></div>
      </div>
      <p style="font-size:12px; margin-top:5px;">${t.progress} ${data.progress}</p>
    `;

    mapDiv.style.display = 'block';
    map.setCenter({lat: data.lat, lng: data.lng});
    map.setZoom(5);
    if(marker) marker.setMap(null);
    marker = new google.maps.Marker({ position: {lat: data.lat, lng: data.lng}, map: map, title: data.current });

  } else {
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#ffebee';
    resultDiv.innerHTML = `<p>${t.notFound}</p>`;
    mapDiv.style.display = 'none';
  }
}
</script>

<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD2FYUYa0XG928-IxtgaC8eZlKwJhOZNGs&callback=initMap"></script>

</body>
  </html>
